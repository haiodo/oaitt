# Линтер ловит то, что форматтер не видит: длинные функции, силовые развороты,
# мёртвый код. Форматирование - зона swift-format, поэтому пробелы и переносы
# здесь выключены, чтобы два инструмента не спорили.

included:
  - Sources

excluded:
  - .build

line_length:
  warning: 110
  error: 140
  ignores_comments: true

function_body_length:
  warning: 80
  error: 140

type_body_length:
  warning: 350
  error: 500

file_length:
  warning: 500
  error: 800

cyclomatic_complexity:
  warning: 15
  error: 25

identifier_name:
  min_length: 1
  excluded: [id, up, to, x, y, t, SQLITE_TRANSIENT]

function_parameter_count:
  warning: 8
  error: 10

large_tuple:
  warning: 3
  error: 4

disabled_rules:
  - trailing_whitespace              # зона swift-format
  - opening_brace                    # зона swift-format
  - trailing_comma                   # swift-format их ставит, спорить бессмысленно
  - optional_data_string_conversion  # String(decoding:as:) не может упасть
  - todo

opt_in_rules:
  - empty_count
  - force_unwrapping
  - implicitly_unwrapped_optional
  - overridden_super_call
  - redundant_nil_coalescing

analyzer_rules:
  - unused_import

force_unwrapping:
  severity: warning
